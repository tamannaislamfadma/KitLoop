<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Admin Dashboard | KitLoop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin-portal.css}">

</head>

<body>

<div class="admin-shell">

    <div th:replace="~{fragments/admin-sidebar :: sidebar}">
    </div>

    <div class="admin-main">

        <div th:replace="~{fragments/admin-topbar :: topbar}">
        </div>

        <main class="admin-content">

            <section class="admin-stat-grid">

                <article class="admin-stat-card">

                    <span>
                        <i class="bi bi-people"></i>
                    </span>

                    <small>Users</small>

                    <strong th:text="${stats.users}">
                        0
                    </strong>

                </article>

                <article class="admin-stat-card">

                    <span>
                        <i class="bi bi-box-seam"></i>
                    </span>

                    <small>Listings</small>

                    <strong th:text="${stats.listings}">
                        0
                    </strong>

                </article>

                <article class="admin-stat-card">

                    <span>
                        <i class="bi bi-hourglass-split"></i>
                    </span>

                    <small>Pending Token Payments</small>

                    <strong th:text="${stats.pendingTokenPayments}">
                        0
                    </strong>

                </article>

                <article class="admin-stat-card">

                    <span>
                        <i class="bi bi-wallet2"></i>
                    </span>

                    <small>Approved Token Total</small>

                    <strong>
                        ৳<span th:text="${#numbers.formatDecimal(stats.approvedTokenTotal, 1, 2)}">
                            0.00
                        </span>
                    </strong>

                </article>

            </section>

            <section class="admin-panel">

                <h2>
                    Administration
                </h2>

                <p>
                    Manage FREE_SHARE payments,
                    KitLoop settings and notifications.
                </p>

                <div class="admin-action-grid">

                    <a th:href="@{/admin/token-payments}"
                       class="admin-action-card">

                        <i class="bi bi-receipt"></i>

                        <div>
                            <strong>Token Payments</strong>
                            <small>
                                Approve FREE_SHARE payment proofs.
                            </small>
                        </div>

                    </a>

                    <a th:href="@{/admin/settings}"
                       class="admin-action-card">

                        <i class="bi bi-gear"></i>

                        <div>
                            <strong>Admin Settings</strong>
                            <small>
                                Change FREE_SHARE bKash number.
                            </small>
                        </div>

                    </a>

                    <a th:href="@{/admin/notifications}"
                       class="admin-action-card">

                        <i class="bi bi-bell"></i>

                        <div>
                            <strong>Notifications</strong>
                            <small>
                                Review payment activity.
                            </small>
                        </div>

                    </a>

                </div>

            </section>

        </main>

    </div>

</div>

<script th:src="@{/js/admin-portal.js}">
</script>

</body>
</html>
