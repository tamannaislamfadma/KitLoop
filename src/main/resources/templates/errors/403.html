<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Access Denied | KitLoop</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}">
</head>

<body>

<main class="error-page">

    <section class="error-card">

        <i class="bi bi-shield-x"></i>

        <h1>Access denied</h1>

        <p>
            Your KitLoop account does not have permission
            to access this area.
        </p>

        <a th:href="@{/post-login}"
           class="error-home-link">

            <i class="bi bi-arrow-left"></i>

            Return to Portal

        </a>

    </section>

</main>

</body>
