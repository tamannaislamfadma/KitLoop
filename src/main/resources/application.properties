spring.application.name=kitloop

server.port=8080

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:mysql://localhost:3306/kitloop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${KITLOOP_DB_USERNAME}
spring.datasource.password=${KITLOOP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=${KITLOOP_MAIL_HOST}
spring.mail.port=${KITLOOP_MAIL_PORT}
spring.mail.username=${KITLOOP_MAIL_USERNAME}
spring.mail.password=${KITLOOP_MAIL_PASSWORD}
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.test-connection=false

kitloop.mail.from=${KITLOOP_MAIL_FROM}

kitloop.otp.expiry-minutes=${KITLOOP_OTP_EXPIRY_MINUTES:5}
kitloop.otp.resend-cooldown-seconds=${KITLOOP_OTP_RESEND_COOLDOWN_SECONDS:60}

kitloop.admin.name=${KITLOOP_ADMIN_NAME}
kitloop.admin.email=${KITLOOP_ADMIN_EMAIL}
kitloop.admin.password=${KITLOOP_ADMIN_PASSWORD}
kitloop.admin.phone=${KITLOOP_ADMIN_PHONE}

kitloop.upload.equipment-directory=${KITLOOP_EQUIPMENT_UPLOAD_DIR:src/main/resources/static/uploads/equipment}
kitloop.upload.equipment-max-bytes=5242880

kitloop.upload.payment-directory=${KITLOOP_PAYMENT_UPLOAD_DIR:src/main/resources/static/uploads/payments}
kitloop.upload.payment-max-bytes=5242880